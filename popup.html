<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safari Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Safari Sync</h1>
      <p id="statusDetail">Loading history sync status</p>
    </div>
    <span id="statePill" class="pill">...</span>
  </header>

  <main>
    <section class="actions">
      <button id="syncNow" type="button">Sync Now</button>
    </section>

    <section class="stats" aria-label="Sync status">
      <div>
        <span class="label">Active profile</span>
        <strong id="activeProfile">None</strong>
      </div>
      <div>
        <span class="label">Switch state</span>
        <strong id="switchState">Unknown</strong>
      </div>
      <div>
        <span class="label">To Safari</span>
        <strong id="toSafari">0</strong>
      </div>
      <div>
        <span class="label">To browser</span>
        <strong id="toBrowser">0</strong>
      </div>
    </section>

    <section id="errorBox" class="error" hidden></section>

  </main>

  <script src="popup.js"></script>
</body>
</html>
