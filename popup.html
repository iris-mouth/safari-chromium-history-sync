<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safari Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Safari Sync</h1>
      <p id="statusDetail">Loading</p>
    </div>
    <span id="statePill" class="pill">...</span>
  </header>

  <main>
    <section class="actions">
      <button id="syncNow" type="button">Sync Now</button>
      <label class="toggle">
        <input id="pauseToggle" type="checkbox">
        <span>Paused</span>
      </label>
    </section>

    <section class="stats" aria-label="Sync status">
      <div>
        <span class="label">Native host</span>
        <strong id="nativeStatus">Unknown</strong>
      </div>
      <div>
        <span class="label">Last sync</span>
        <strong id="lastSync">Never</strong>
      </div>
      <div>
        <span class="label">Last run</span>
        <strong id="lastCounts">+0 -0 ~0</strong>
      </div>
      <div>
        <span class="label">Queue</span>
        <strong id="queueLength">0</strong>
      </div>
    </section>

    <section id="errorBox" class="error" hidden></section>

    <section class="historyBlock">
      <div class="sectionHead">
        <h2>Recent Activity</h2>
        <button id="clearHistory" type="button" class="linkButton">Clear</button>
      </div>
      <ol id="historyList" class="history"></ol>
    </section>
  </main>

  <footer>
    <button id="optionsBtn" type="button" class="secondary">Options</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
